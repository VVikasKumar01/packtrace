services:
  - type: web
    name: packtrace-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/create_samples.py
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
